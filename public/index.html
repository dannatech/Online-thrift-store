<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Chance Thrift</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">♻️ Second Chance <span>Thrift</span></a>
    <input id="search" type="search" placeholder="Search jeans, lamps, books…" aria-label="Search items">
    <div class="actions">
      <button id="sell-btn" class="btn btn-outline">Sell an item</button>
      <button id="cart-btn" class="btn" aria-label="Open cart">🛒 Cart <span id="cart-count" class="badge">0</span></button>
    </div>
  </header>

  <section class="hero">
    <h1>Pre-loved finds, one of a kind.</h1>
    <p>Every item is unique. When it's gone, it's gone — shop sustainably and give great things a second life.</p>
  </section>

  <main class="layout">
    <aside class="filters" aria-label="Filters">
      <h2>Filter</h2>
      <label>Category <select id="f-category"><option value="">All</option></select></label>
      <label>Condition <select id="f-condition"><option value="">Any</option></select></label>
      <label>Max price <span id="f-price-label">Any</span>
        <input id="f-price" type="range" min="5" max="100" step="5" value="100">
      </label>
      <label>Sort by
        <select id="f-sort">
          <option value="newest">Newest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </label>
      <button id="f-reset" class="btn btn-outline btn-small">Reset filters</button>
    </aside>

    <section>
      <p id="result-count" class="muted"></p>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>
  </main>

  <!-- Product detail -->
  <dialog id="product-dialog" class="dialog">
    <div id="product-detail"></div>
  </dialog>

  <!-- Cart drawer -->
  <aside id="cart" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Your cart</h2>
      <button class="icon-btn" data-close-cart aria-label="Close cart">✕</button>
    </div>
    <ul id="cart-items" class="cart-items"></ul>
    <div class="drawer-foot">
      <p class="total">Total: <strong id="cart-total">$0.00</strong></p>
      <form id="checkout-form" class="form">
        <input name="name" placeholder="Full name" required>
        <input name="email" type="email" placeholder="Email" required>
        <textarea name="address" placeholder="Shipping address" rows="2" required></textarea>
        <p id="checkout-error" class="error" role="alert"></p>
        <button class="btn btn-block" type="submit">Place order</button>
      </form>
    </div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <!-- Sell form -->
  <dialog id="sell-dialog" class="dialog">
    <form id="sell-form" class="form" method="dialog">
      <h2>Sell an item</h2>
      <input name="title" placeholder="Item title" required minlength="3" maxlength="80">
      <textarea name="description" placeholder="Describe it (brand, flaws, measurements…)" rows="3" maxlength="500"></textarea>
      <div class="row">
        <select name="category" id="sell-category" required></select>
        <select name="condition" id="sell-condition" required></select>
      </div>
      <div class="row">
        <input name="size" placeholder="Size (e.g. M, 42)" maxlength="20">
        <input name="price" type="number" min="1" max="10000" step="0.01" placeholder="Price ($)" required>
      </div>
      <input name="seller" placeholder="Your name" required maxlength="50">
      <p id="sell-error" class="error" role="alert"></p>
      <div class="row">
        <button type="button" class="btn btn-outline" data-close-dialog>Cancel</button>
        <button type="submit" class="btn">List item</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer">© Second Chance Thrift · Reduce · Reuse · Restyle</footer>
  <script src="app.js"></script>
</body>
</html>
