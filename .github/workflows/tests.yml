name: Tests

# GitHub Pages publishes this branch as-is ("Deploy from a branch"): the root
# index.html forwards visitors to the storefront in public/. This workflow
# just keeps the tests green on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
